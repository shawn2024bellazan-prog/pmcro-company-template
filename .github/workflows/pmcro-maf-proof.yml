name: PMCR-O native Microsoft Agent Framework proof
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maf-native-aiagent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Execute native AIAgent RunAsync and RunStreamingAsync
        run: bash proof/maf/run-maf-proof.sh
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmcro-maf-native-agent-evidence
          path: evidence/maf/
          if-no-files-found: warn

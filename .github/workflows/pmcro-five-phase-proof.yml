name: PMCR-O native five-phase MAF execution proof
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-phase-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Execute five native MAF phases and verify chained trail
        run: bash proof/cycle/run-cycle-proof.sh
      - name: Upload phase invocation and trail evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmcro-native-five-phase-trail-evidence
          path: evidence/cycle/
          if-no-files-found: warn
